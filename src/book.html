<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d8d7cd">
<meta name="description" content="Transplant: weathered sheets from a poetic transplant manual, held in a book of ink, paper, and care.">
<title>Transplant · A poetic manual</title>
<script type="text/plain" id="font-license">@@FONT_LICENSE@@</script>
<style>
@font-face{font-family:Ribbon;src:url(data:font/ttf;base64,@@FONT@@) format('truetype');font-display:block}
:root{color-scheme:light;--desk:#d8d7cd;--type:#333b36;--muted:#6b7068;--red:#a52c4c}
*{box-sizing:border-box}html{background:var(--desk);scrollbar-color:#a9aaa0 var(--desk)}
body{margin:0;color:var(--type);font:12px 'Courier New',monospace}button,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.32;cursor:default}button:focus-visible,select:focus-visible,.folio:focus-visible{outline:2px solid var(--red);outline-offset:5px}
.masthead{position:relative;z-index:6;max-width:1760px;margin:auto;padding:29px 44px 24px;display:flex;align-items:center;gap:28px}
.identity{margin-right:auto;display:flex;align-items:baseline;gap:18px}h1{font:400 17px Ribbon,monospace;letter-spacing:.04em;margin:0}.subtitle{font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.views{display:flex;gap:22px}.views button,.closer{border:0;border-radius:0;background:none;padding:7px 0;font-size:11px}.views button{border-bottom:1px solid transparent;color:var(--muted)}.views button[aria-pressed=true]{color:var(--type);border-color:var(--red)}button:hover:not(:disabled){color:var(--red)}
.closer{display:flex;gap:7px;align-items:center;white-space:nowrap}.zoom-icon{display:inline-block;width:10px;height:10px;border:1px solid currentColor;border-radius:50%;position:relative}.zoom-icon::after{content:'';position:absolute;width:4px;height:1px;background:currentColor;right:-3px;bottom:-2px;transform:rotate(48deg)}
.sheet-menu{border-left:1px solid #b6b8ad;padding-left:23px}.sheet-menu select{width:72px;padding:5px 0;border:0;background:transparent;font-size:11px;cursor:pointer}.sheet-menu option{background:#e6e4d8;color:#333b36}
.paper-well{overflow:auto;padding:30px 38px 36px;scrollbar-width:thin}.paper-well.turning-well{overflow:hidden}.folio{position:relative;isolation:isolate;width:min(100%,1600px,calc(154.545svh - 355px));aspect-ratio:34/22;margin:auto;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.leaf{position:absolute;top:0;width:50%;height:100%;background:#eee6d1;box-shadow:0 2px 3px #403e2c26,0 13px 28px -12px #3e3b2640,0 32px 46px -27px #3e3b263b;pointer-events:none}.leaf[hidden]{display:none}.leaf.left{left:0;border-radius:2px 0 0 3px}.leaf.right{left:50%;border-radius:0 2px 3px 0}
.leaf:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 0 1px #78684a16,0 2px 0 #dfdac9,0 4px 0 #d6d0bd,0 5px 1px #a69e8440}.leaf img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}.leaf.left img{transform:scaleX(-1)}
.binding{position:absolute;left:50%;top:0;bottom:0;width:3.2%;max-width:45px;transform:translateX(-50%);z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,#51412d0a 24%,#51412d26 47%,#44351d42 50%,#51412d22 54%,#51412d09 78%,transparent)}.folio[data-empty-left=true] .binding{width:1.4%;transform:translateX(-22%);opacity:.6}
.curl{position:absolute;left:-3%;top:-5%;width:106%;height:110%;z-index:4;pointer-events:none;visibility:hidden}.folio.turning{cursor:grabbing}.folio.turning .curl{visibility:visible}.turn-shadow{position:absolute;top:0;bottom:0;left:0;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,#342d1e16 25%,#342d1e5a 55%,transparent);transform-origin:center center}
.corner{position:absolute;right:0;bottom:0;width:10%;height:23%;z-index:3;pointer-events:none}.corner.left-corner{right:auto;left:0}.corner:after{content:'';position:absolute;right:12px;bottom:13px;width:14px;height:14px;border-right:1px solid #655b3638;border-bottom:1px solid #655b3638;opacity:0;transition:opacity .3s}.left-corner:after{right:auto;left:12px;border-right:0;border-left:1px solid #655b3638}.folio:hover .corner:after{opacity:1}.folio.turning .corner:after,.folio[data-empty-left=true] .left-corner:after{opacity:0}
body[data-closer=true] .folio{width:2600px;max-width:none;touch-action:pan-x pan-y pinch-zoom;cursor:default}body[data-closer=true] .corner{display:none}
.reader-nav{position:sticky;bottom:0;z-index:7;width:min(100%,520px);margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 36px 17px;background:linear-gradient(transparent,var(--desk) 24%);gap:20px}
.reader-nav button{border:0;background:none;padding:10px 6px;font-size:11px;min-width:100px;display:flex;align-items:center;gap:12px}.reader-nav button:last-child{justify-content:flex-end}.arrow{width:23px;height:1px;background:currentColor;display:inline-block;position:relative}.arrow:after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}.arrow.left{transform:rotate(180deg)}.counter{text-align:center;font-size:10px;line-height:1.9;color:var(--muted);flex:1;min-width:0}.counter b{font-weight:400;color:var(--type)}
.colophon{max-width:1680px;margin:auto;padding:1px 42px 27px;display:flex;justify-content:space-between;gap:22px;color:var(--muted);font-size:9px;line-height:1.8}.colophon p{margin:0}.ribbons{display:inline-flex;gap:3px;margin-right:9px;vertical-align:middle}.ribbons i{width:11px;height:3px;background:#ac3455}.ribbons i:nth-child(2){background:#287648}.ribbons i:nth-child(3){background:#383467}.hint{text-align:right}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.masthead{padding:23px 20px 10px;gap:19px;flex-wrap:wrap}.identity{width:100%;gap:15px}.views{gap:23px}.closer{margin-left:auto}.sheet-menu{padding-left:16px}.sheet-menu select{width:65px}.paper-well{padding:23px 16px 22px}.reader-nav{padding:19px 18px 12px;gap:9px}.reader-nav button{min-width:80px}.colophon{padding:1px 22px 25px;font-size:8px}.hint{max-width:140px}body[data-closer=true] .folio{width:1800px}.corner:after{right:7px;bottom:8px;width:10px;height:10px}.left-corner:after{left:7px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{@page{size:letter landscape;margin:0}.masthead,.reader-nav,.colophon{display:none}.paper-well{padding:0;overflow:visible}.folio,body[data-closer=true] .folio{width:100%;print-color-adjust:exact;-webkit-print-color-adjust:exact}.leaf{box-shadow:none}.leaf:after{display:none}}
</style>
</head>
<body data-view="impression" data-closer="false">
<header class="masthead">
 <div class="identity"><h1>transplant</h1><span class="subtitle">a poetic rendering</span></div>
 <nav class="views" aria-label="Page view"><button type="button" data-mode="impression" aria-pressed="true">Impression</button><button type="button" data-mode="source" aria-pressed="false">Source page</button></nav>
 <button type="button" class="closer" aria-pressed="false" aria-label="Enlarge the book for closer reading"><span class="zoom-icon" aria-hidden="true"></span><span class="zoom-label">Closer</span></button>
 <label class="sheet-menu"><span class="visually-hidden">Go to sheet</span><select id="sheet-picker" aria-label="Go to sheet"></select></label>
</header>
<main>
 <div class="paper-well"><div class="folio" id="folio" tabindex="0" role="group" aria-label="Open poetic manual. Pull the right page left to turn forward, or the left page right to turn back." data-turning="false" data-turn-phase="idle" data-empty-left="true">
  <div class="leaf left" id="left-leaf" hidden><img id="back-image" alt="" draggable="false" width="850" height="1100"></div>
  <div class="leaf right" id="right-leaf"><img id="sheet-image" alt="Preparing the first sheet" draggable="false" width="1700" height="2200"></div>
  <div class="binding" aria-hidden="true"></div><div class="turn-shadow" aria-hidden="true"></div><canvas class="curl" id="curl" aria-hidden="true"></canvas><div class="corner" aria-hidden="true"></div><div class="corner left-corner" aria-hidden="true"></div>
 </div></div>
 <article class="visually-hidden" aria-label="Sheet description"><p id="reading-description"></p></article>
</main>
<nav class="reader-nav" aria-label="Turn sheets">
 <button id="previous" type="button" aria-label="Previous sheet" disabled><span class="arrow left" aria-hidden="true"></span>Previous</button>
 <div class="counter"><b id="folio-number">01</b> / @@PAGE_COUNT@@<br><span id="sheet-title">Dedication and consent</span></div>
 <button id="next" type="button" aria-label="Next sheet">Next<span class="arrow" aria-hidden="true"></span></button>
</nav>
<footer class="colophon"><p><span class="ribbons" aria-hidden="true"><i></i><i></i><i></i></span>Pre-liver poetic transplant manual</p><p class="hint">Right page to the left. Left page to the right.</p></footer>
<p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
<noscript><p>Enable JavaScript to open the book.</p></noscript>
<script>const BOOK=@@BOOK@@;
@@BOOK_CODE@@
</script>
</body></html>
