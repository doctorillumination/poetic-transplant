<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d8d7cd">
<meta name="description" content="Transplant: fifteen weathered sheets from a poetic transplant manual, held in a book of ink, paper, and care.">
<title>Transplant · A poetic manual</title>
<script type="text/plain" id="font-license">@@FONT_LICENSE@@</script>
<style>
@font-face{font-family:Ribbon;src:url(data:font/ttf;base64,@@FONT@@) format('truetype');font-display:block}
:root{color-scheme:light;--desk:#d8d7cd;--type:#333b36;--muted:#6b7068;--red:#a52c4c}
*{box-sizing:border-box}html{background:var(--desk);scrollbar-color:#a9aaa0 var(--desk)}
body{margin:0;color:var(--type);font:12px 'Courier New',monospace}button,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.32;cursor:default}button:focus-visible,select:focus-visible,.folio:focus-visible{outline:2px solid var(--red);outline-offset:5px}
.masthead{position:relative;z-index:6;max-width:1480px;margin:auto;padding:29px 44px 24px;display:flex;align-items:center;gap:28px}
.identity{margin-right:auto;display:flex;align-items:baseline;gap:18px}h1{font:400 17px Ribbon,monospace;letter-spacing:.04em;margin:0}.subtitle{font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.views{display:flex;gap:22px}.views button,.closer{border:0;border-radius:0;background:none;padding:7px 0;font-size:11px}.views button{border-bottom:1px solid transparent;color:var(--muted)}.views button[aria-pressed=true]{color:var(--type);border-color:var(--red)}button:hover:not(:disabled){color:var(--red)}
.closer{display:flex;gap:7px;align-items:center;white-space:nowrap}.zoom-icon{display:inline-block;width:10px;height:10px;border:1px solid currentColor;border-radius:50%;position:relative}.zoom-icon::after{content:'';position:absolute;width:4px;height:1px;background:currentColor;right:-3px;bottom:-2px;transform:rotate(48deg)}
.sheet-menu{border-left:1px solid #b6b8ad;padding-left:23px}.sheet-menu select{width:72px;padding:5px 0;border:0;background:transparent;font-size:11px;cursor:pointer}.sheet-menu option{background:#e6e4d8;color:#333b36}
.paper-well{overflow-x:auto;padding:30px 38px 36px;scrollbar-width:thin}.paper-well.turning-well{overflow:hidden}.folio{position:relative;isolation:isolate;width:min(100%,1000px);aspect-ratio:17/22;margin:auto;background:#eee6d1;outline:none;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px #403e2c26,1px 7px 13px #44402c13,0 26px 60px -30px #3e3b2652;cursor:grab}
.folio:before{content:'';position:absolute;left:-9px;top:3px;bottom:-2px;width:12px;background:linear-gradient(90deg,#817d6520,#d1c9b9 48%,#eeeadb 58%,#8c826536);border-radius:2px 0 0 2px;z-index:-1}
.folio:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 6px 0 15px -12px #51412d8c,inset 0 0 0 1px #78684a1a,1px 2px 0 #dfdac9,3px 4px 0 #d6d0bd,4px 5px 1px #a69e841f}
#sheet-image{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.curl{position:absolute;left:-8%;top:-5%;width:116%;height:110%;z-index:4;pointer-events:none;display:none}.folio.turning{cursor:grabbing}.folio.turning .curl{display:block}.turn-shadow{position:absolute;top:0;bottom:0;left:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,#342d1e70 50%,transparent);filter:blur(8px);transform-origin:center center}
.corner{position:absolute;right:0;bottom:0;width:19%;height:22%;z-index:3;touch-action:none;cursor:grab}.corner:after{content:'';position:absolute;right:12px;bottom:13px;width:14px;height:14px;border-right:1px solid #655b3638;border-bottom:1px solid #655b3638;opacity:0;transition:opacity .3s}.folio:hover .corner:after{opacity:1}.folio.turning .corner:after{opacity:0}
body[data-closer=true] .corner{pointer-events:none;touch-action:auto}
body[data-closer=true] .folio{width:1380px;max-width:none;touch-action:pan-x pan-y pinch-zoom;cursor:default}.reader-nav{position:sticky;bottom:0;z-index:7;max-width:1088px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 36px 17px;background:linear-gradient(transparent,var(--desk) 24%);gap:20px}
.reader-nav button{border:0;background:none;padding:10px 6px;font-size:11px;min-width:100px;display:flex;align-items:center;gap:12px}.reader-nav button:last-child{justify-content:flex-end}.arrow{width:23px;height:1px;background:currentColor;display:inline-block;position:relative}.arrow:after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}.arrow.left{transform:rotate(180deg)}.counter{text-align:center;font-size:10px;line-height:1.9;color:var(--muted);flex:1;min-width:0}.counter b{font-weight:400;color:var(--type)}
.colophon{max-width:1088px;margin:auto;padding:1px 42px 27px;display:flex;justify-content:space-between;gap:22px;color:var(--muted);font-size:9px;line-height:1.8}.colophon p{margin:0}.ribbons{display:inline-flex;gap:3px;margin-right:9px;vertical-align:middle}.ribbons i{width:11px;height:3px;background:#ac3455}.ribbons i:nth-child(2){background:#287648}.ribbons i:nth-child(3){background:#383467}.hint{text-align:right}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.masthead{padding:23px 20px 10px;gap:19px;flex-wrap:wrap}.identity{width:100%;gap:15px}.views{gap:23px}.closer{margin-left:auto}.sheet-menu{padding-left:16px}.sheet-menu select{width:65px}.paper-well{padding:23px 16px 22px}.reader-nav{padding:19px 18px 12px;gap:9px}.reader-nav button{min-width:80px}.colophon{padding:1px 22px 25px;font-size:8px}.hint{max-width:140px}body[data-closer=true] .folio{width:1000px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{@page{size:letter;margin:0}.masthead,.reader-nav,.colophon{display:none}.paper-well{padding:0;overflow:visible}.folio,body[data-closer=true] .folio{width:100%;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}.folio:before,.folio:after{display:none}}
</style>
</head>
<body data-view="impression" data-closer="false">
<header class="masthead">
 <div class="identity"><h1>transplant</h1><span class="subtitle">a poetic rendering</span></div>
 <nav class="views" aria-label="Page view"><button type="button" data-mode="impression" aria-pressed="true">Impression</button><button type="button" data-mode="source" aria-pressed="false">Source page</button></nav>
 <button type="button" class="closer" aria-pressed="false" aria-label="Enlarge the sheet for closer reading"><span class="zoom-icon" aria-hidden="true"></span><span class="zoom-label">Closer</span></button>
 <label class="sheet-menu"><span class="visually-hidden">Go to sheet</span><select id="sheet-picker" aria-label="Go to sheet"></select></label>
</header>
<main>
 <div class="paper-well"><div class="folio" id="folio" tabindex="0" role="group" aria-label="Poetic manual. Drag the right edge or bottom corner to turn the sheet." data-turning="false" data-turn-phase="idle">
  <img id="sheet-image" alt="Preparing the first sheet" draggable="false" width="1700" height="2200">
  <div class="turn-shadow" aria-hidden="true"></div><canvas class="curl" id="curl" aria-hidden="true"></canvas><div class="corner" aria-hidden="true"></div>
 </div></div>
 <article class="visually-hidden" aria-label="Sheet description"><p id="reading-description"></p></article>
</main>
<nav class="reader-nav" aria-label="Turn sheets">
 <button id="previous" type="button" aria-label="Previous sheet" disabled><span class="arrow left" aria-hidden="true"></span>Previous</button>
 <div class="counter"><b id="folio-number">01</b> / 15<br><span id="sheet-title">Dedication and consent</span></div>
 <button id="next" type="button" aria-label="Next sheet">Next<span class="arrow" aria-hidden="true"></span></button>
</nav>
<footer class="colophon"><p><span class="ribbons" aria-hidden="true"><i></i><i></i><i></i></span>Pre-liver poetic transplant manual</p><p class="hint">Pull a corner, or turn a sheet.</p></footer>
<p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
<noscript><p>Enable JavaScript to open the fifteen-sheet book.</p></noscript>
<script>const BOOK=@@BOOK@@;
@@BOOK_CODE@@
</script>
</body></html>
